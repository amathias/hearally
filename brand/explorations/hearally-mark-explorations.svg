<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="960" height="860" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .card { fill: #14243A; }
      .sand { fill: #F6F1E8; }
      .amber { fill: #E8934A; }
      .muted { fill: #9FB0AE; font-size: 13px; }
      .wm { fill: #F6F1E8; font-size: 26px; font-weight: 600; }
      .label { fill: #5A6672; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
      .note { fill: #5A6672; font-size: 12px; }
      .s-sand { fill: none; stroke: #F6F1E8; stroke-linecap: round; }
      .s-amber { fill: none; stroke: #E8934A; stroke-linecap: round; }
      .f-sand { fill: #F6F1E8; }
      .f-amber { fill: #E8934A; }
    </style>
  </defs>
  <rect width="960" height="860" fill="#FFFFFF"/>
  <text x="48" y="44" fill="#14243A" font-size="20" font-weight="600">Hearally - mark explorations</text>
  <text x="48" y="66" class="label">tagline: keeps the people on your side close.</text>

  <!-- ============ 1: person + listening arcs ============ -->
  <text x="48" y="104" class="label">1 · a person, listening</text>
  <g transform="translate(48,114)">
    <rect width="420" height="120" rx="16" class="card"/>
    <g transform="translate(58,62)">
      <circle cx="0" cy="-12" r="8" class="f-sand"/>
      <path d="M -14 14 A 14 14 0 0 1 14 14" class="s-sand" stroke-width="7"/>
      <path d="M 30 -22 A 28 28 0 0 1 30 22" class="s-sand" stroke-width="5.5"/>
      <path d="M 46 -34 A 43 43 0 0 1 46 34" class="s-amber" stroke-width="5.5"/>
    </g>
    <text x="150" y="58" class="wm">hear<tspan class="amber" font-weight="700">Ally</tspan></text>
    <text x="150" y="82" class="muted">Keeps the people on your side close.</text>
  </g>
  <text x="48" y="252" class="note">Head and shoulders, sound leaving them. Clear at small sizes.</text>

  <!-- ============ 2: two people, shared arc ============ -->
  <text x="504" y="104" class="label">2 · two people, one arc</text>
  <g transform="translate(504,114)">
    <rect width="408" height="120" rx="16" class="card"/>
    <g transform="translate(62,62)">
      <circle cx="-12" cy="-10" r="8" class="f-sand"/>
      <path d="M -26 14 A 14 14 0 0 1 2 14" class="s-sand" stroke-width="7"/>
      <circle cx="16" cy="-6" r="6.5" class="f-amber"/>
      <path d="M 4 16 A 12 12 0 0 1 28 16" class="s-amber" stroke-width="6"/>
      <path d="M 44 -30 A 38 38 0 0 1 44 30" class="s-sand" stroke-width="5" opacity=".75"/>
    </g>
    <text x="150" y="58" class="wm">hear<tspan class="amber" font-weight="700">Ally</tspan></text>
    <text x="150" y="82" class="muted">Keeps the people on your side close.</text>
  </g>
  <text x="504" y="252" class="note">Two figures side by side. Literally "on your side".</text>

  <!-- ============ 3: held close - arc wraps around ============ -->
  <text x="48" y="292" class="label">3 · held close</text>
  <g transform="translate(48,302)">
    <rect width="420" height="120" rx="16" class="card"/>
    <g transform="translate(62,62)">
      <path d="M 14 -40 A 42 42 0 1 0 14 40" class="s-amber" stroke-width="6"/>
      <circle cx="-4" cy="-11" r="8" class="f-sand"/>
      <path d="M -18 15 A 14 14 0 0 1 10 15" class="s-sand" stroke-width="7"/>
    </g>
    <text x="150" y="58" class="wm">hear<tspan class="amber" font-weight="700">Ally</tspan></text>
    <text x="150" y="82" class="muted">Keeps the people on your side close.</text>
  </g>
  <text x="48" y="440" class="note">An arc curving around the person: presence, not surveillance.</text>

  <!-- ============ 4: speech bubble person ============ -->
  <text x="504" y="292" class="label">4 · someone speaking</text>
  <g transform="translate(504,302)">
    <rect width="408" height="120" rx="16" class="card"/>
    <g transform="translate(58,62)">
      <path d="M -16 -22 h 32 a 10 10 0 0 1 10 10 v 18 a 10 10 0 0 1 -10 10 h -16 l -12 11 v -11 h -4 a 10 10 0 0 1 -10 -10 v -18 a 10 10 0 0 1 10 -10 z" class="f-sand"/>
      <circle cx="-6" cy="-3" r="3.2" fill="#14243A"/>
      <circle cx="4" cy="-3" r="3.2" fill="#14243A"/>
      <path d="M 44 -28 A 34 34 0 0 1 44 28" class="s-amber" stroke-width="5.5"/>
    </g>
    <text x="150" y="58" class="wm">hear<tspan class="amber" font-weight="700">Ally</tspan></text>
    <text x="150" y="82" class="muted">Keeps the people on your side close.</text>
  </g>
  <text x="504" y="440" class="note">A speech bubble with two dots: conversation, softly.</text>

  <!-- ============ 5: smile inside the circle ============ -->
  <text x="48" y="480" class="label">5 · a quiet smile</text>
  <g transform="translate(48,490)">
    <rect width="420" height="120" rx="16" class="card"/>
    <g transform="translate(60,62)">
      <circle cx="0" cy="0" r="17" class="f-sand"/>
      <path d="M -8 4 q 8 9 16 0" fill="none" stroke="#14243A" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M 32 -24 A 30 30 0 0 1 32 24" class="s-sand" stroke-width="5.5"/>
      <path d="M 48 -36 A 45 45 0 0 1 48 36" class="s-amber" stroke-width="5.5"/>
    </g>
    <text x="150" y="58" class="wm">hear<tspan class="amber" font-weight="700">Ally</tspan></text>
    <text x="150" y="82" class="muted">Keeps the people on your side close.</text>
  </g>
  <text x="48" y="628" class="note">Friendly, but risks reading as a toy or a chatbot.</text>

  <!-- ============ 6: pair inside a ring ============ -->
  <text x="504" y="480" class="label">6 · a pair, kept close</text>
  <g transform="translate(504,490)">
    <rect width="408" height="120" rx="16" class="card"/>
    <g transform="translate(66,62)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#F6F1E8" stroke-width="5" opacity=".28"/>
      <circle cx="-10" cy="-4" r="9" class="f-sand"/>
      <circle cx="12" cy="6" r="7" class="f-amber"/>
      <path d="M 26 -26 A 36 36 0 0 1 26 26" class="s-amber" stroke-width="5" opacity=".9"/>
    </g>
    <text x="150" y="58" class="wm">hear<tspan class="amber" font-weight="700">Ally</tspan></text>
    <text x="150" y="82" class="muted">Keeps the people on your side close.</text>
  </g>
  <text x="504" y="628" class="note">Two dots inside a soft ring: together, and held.</text>

  <!-- ============ favicon row ============ -->
  <text x="48" y="676" class="label">at favicon size (32px) and app-icon size</text>
  <g transform="translate(48,690)">
    <rect width="864" height="128" rx="16" fill="#FDFCFA" stroke="#E8E2D8"/>

    <g transform="translate(60,64)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" class="card"/>
      <g transform="scale(.38)">
        <circle cx="0" cy="-12" r="8" class="f-sand"/><path d="M -14 14 A 14 14 0 0 1 14 14" class="s-sand" stroke-width="7"/>
        <path d="M 30 -22 A 28 28 0 0 1 30 22" class="s-sand" stroke-width="5.5"/><path d="M 46 -34 A 43 43 0 0 1 46 34" class="s-amber" stroke-width="5.5"/>
      </g>
      <text x="0" y="40" class="note" text-anchor="middle">1</text>
    </g>

    <g transform="translate(190,64)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" class="card"/>
      <g transform="scale(.38)">
        <circle cx="-12" cy="-10" r="8" class="f-sand"/><path d="M -26 14 A 14 14 0 0 1 2 14" class="s-sand" stroke-width="7"/>
        <circle cx="16" cy="-6" r="6.5" class="f-amber"/><path d="M 4 16 A 12 12 0 0 1 28 16" class="s-amber" stroke-width="6"/>
      </g>
      <text x="0" y="40" class="note" text-anchor="middle">2</text>
    </g>

    <g transform="translate(320,64)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" class="card"/>
      <g transform="scale(.42)">
        <path d="M 14 -40 A 42 42 0 1 0 14 40" class="s-amber" stroke-width="7"/>
        <circle cx="-4" cy="-11" r="8" class="f-sand"/><path d="M -18 15 A 14 14 0 0 1 10 15" class="s-sand" stroke-width="7"/>
      </g>
      <text x="0" y="40" class="note" text-anchor="middle">3</text>
    </g>

    <g transform="translate(450,64)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" class="card"/>
      <g transform="scale(.36)">
        <path d="M -16 -22 h 32 a 10 10 0 0 1 10 10 v 18 a 10 10 0 0 1 -10 10 h -16 l -12 11 v -11 h -4 a 10 10 0 0 1 -10 -10 v -18 a 10 10 0 0 1 10 -10 z" class="f-sand"/>
        <circle cx="-6" cy="-3" r="3.2" fill="#14243A"/><circle cx="4" cy="-3" r="3.2" fill="#14243A"/>
      </g>
      <text x="0" y="40" class="note" text-anchor="middle">4</text>
    </g>

    <g transform="translate(580,64)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" class="card"/>
      <g transform="scale(.42)">
        <circle cx="0" cy="0" r="17" class="f-sand"/>
        <path d="M -8 4 q 8 9 16 0" fill="none" stroke="#14243A" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M 32 -24 A 30 30 0 0 1 32 24" class="s-amber" stroke-width="5.5"/>
      </g>
      <text x="0" y="40" class="note" text-anchor="middle">5</text>
    </g>

    <g transform="translate(710,64)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" class="card"/>
      <g transform="scale(.42)">
        <circle cx="-10" cy="-4" r="9" class="f-sand"/><circle cx="12" cy="6" r="7" class="f-amber"/>
        <path d="M 26 -26 A 36 36 0 0 1 26 26" class="s-amber" stroke-width="5"/>
      </g>
      <text x="0" y="40" class="note" text-anchor="middle">6</text>
    </g>
  </g>
</svg>
